services:
  - type: web
    name: avidus-backend
    env: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    # `indexes` builds missing MongoDB indexes (autoIndex is off in production); no-op when they exist.
    startCommand: npm run indexes && npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://avidus-frontend.onrender.com
      - key: PORT
        value: "5050"
      - key: LOG_LEVEL
        value: info

  - type: web
    name: avidus-frontend
    env: static
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
    envVars:
      - key: VITE_API_URL
        value: https://avidus-backend.onrender.com/api
